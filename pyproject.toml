[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-engine-core"
version = "0.1.0"
description = "Cut short vertical clips from long videos: transcript, picked moments, clean cuts, 9:16 reframe, captions, hook title, quality gate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
# the `whisper` CLI the engine calls for every transcription pass (needs torch)
whisper = ["openai-whisper>=20240930"]
# yt-dlp to download URLs (a local file needs none)
download = ["yt-dlp>=2024.1.1"]
# fuzzy text matching; without it a difflib equivalent is used
fuzzy = ["rapidfuzz>=3.0"]
dev = ["pytest>=7.0"]

[project.scripts]
clipengine = "clipengine.cli:main"

[tool.setuptools.packages.find]
include = ["clipengine*"]

[tool.setuptools.package-data]
clipengine = ["prompt_packs/*.json", "render/models/*.onnx", "render/models/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
